# Publishes to PyPI when you push a tag like v0.6.0 – no API token needed ("Trusted Publishing").
# One-time setup on pypi.org: Account → Publishing → add a pending publisher with
#   project name: ied-inspector, owner/repository: <your GitHub repo>, workflow: publish.yml, environment: pypi
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test
        run: |
          python -m pip install dist/*.whl
          python -c "import ied_inspector, os; p=os.path.dirname(ied_inspector.__file__); assert os.path.exists(os.path.join(p,'web','index.html')); print(ied_inspector.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
