<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16324c"/><stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd8ff"/><stop offset="1" stop-color="#1b8fd6"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1f4566"/><stop offset="1" stop-color="#0c1c2b"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="47.5" fill="none" stroke="#2a5577" stroke-width="1.5"/>
  <!-- circuit traces behind the shield -->
  <g stroke="#2b6a92" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M28 92 H58 L70 104"/><path d="M28 164 H52 L64 152"/>
    <path d="M228 76 H200 L190 86"/><path d="M228 136 H206"/>
  </g>
  <g fill="#3fd8ff"><circle cx="28" cy="92" r="6"/><circle cx="28" cy="164" r="6"/><circle cx="228" cy="76" r="6"/><circle cx="228" cy="136" r="6"/></g>
  <!-- shield -->
  <path d="M128 30 L196 56 V122 C196 168 166 202 128 220 C90 202 60 168 60 122 V56 Z"
        fill="#0f2335" stroke="url(#sh)" stroke-width="11" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- IED front panel inside the shield -->
  <rect x="94" y="70" width="68" height="40" rx="7" fill="#183a57" stroke="#3fd8ff" stroke-width="4"/>
  <circle cx="111" cy="90" r="7" fill="#35e08a"/><circle cx="128" cy="90" r="7" fill="#ffb627"/><circle cx="145" cy="90" r="7" fill="#ff4d5e"/>
  <!-- GOOSE pulse line -->
  <path d="M84 140 H104 L112 124 L124 158 L134 132 L140 140 H172" fill="none" stroke="#3fd8ff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- magnifier -->
  <g filter="url(#glow)">
    <line x1="196" y1="196" x2="226" y2="226" stroke="#e8f4ff" stroke-width="16" stroke-linecap="round"/>
    <circle cx="176" cy="176" r="30" fill="url(#lens)" stroke="#e8f4ff" stroke-width="10"/>
  </g>
  <path d="M160 178 L172 190 L194 164" fill="none" stroke="#35e08a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
